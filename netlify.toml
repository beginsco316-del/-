[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[redirects]]
  from = "/manage-photos"
  to = "/manage-photos.html"
  status = 200
  force = true

[[headers]]
  for = "/manage-photos"
  [headers.values]
    X-Robots-Tag = "noindex"
