<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BEGIN.S DESIGN | Admin</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    body.admin-page { background: #f4f3ef; }
    .admin-shell { width: min(1180px, calc(100% - 28px)); place-items: stretch; }
    [hidden] { display: none !important; }
    .admin-panel { display: grid; gap: 20px; }
    .admin-toolbar, .admin-tabs, .admin-actions, .admin-row-actions, .gallery-actions {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    }
    .admin-toolbar { justify-content: space-between; }
    .admin-tabs button, .admin-actions button, .admin-row-actions button, .gallery-actions button,
    .download-button, .import-button {
      min-height: 42px; padding: 0 14px; color: var(--ink); background: #fff;
      border: 1px solid rgba(22, 23, 19, 0.12); border-radius: 8px; font-weight: 900; cursor: pointer;
    }
    .admin-tabs button.is-active { color: #fff; background: var(--green-dark); border-color: var(--green-dark); }
    .admin-status { min-height: 24px; color: var(--green-dark); font-weight: 900; }
    .import-button { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .import-button input { max-width: 100%; }
    .admin-list { display: grid; gap: 14px; }
    .editor-card {
      display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 16px; padding: 16px;
      background: rgba(255, 255, 255, 0.78); border: 1px solid rgba(22, 23, 19, 0.1); border-radius: 8px;
    }
    .editor-preview { overflow: hidden; align-self: start; background: #e8e8e2; border-radius: 8px; aspect-ratio: 4 / 3; }
    .drag-handle { cursor: grab; user-select: none; touch-action: manipulation; }
    .drop-target { outline: 2px solid var(--green-dark); outline-offset: 2px; }
    .editor-preview img { width: 100%; height: 100%; object-fit: cover; }
    .editor-fields { display: grid; gap: 10px; }
    .field-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .admin-field { display: grid; gap: 6px; color: var(--muted); font-size: 13px; font-weight: 900; }
    .admin-field input, .admin-field textarea, .gallery-item input {
      width: 100%; min-height: 42px; padding: 10px 12px; color: var(--ink); background: #fff;
      border: 1px solid rgba(22, 23, 19, 0.16); border-radius: 8px; font: inherit; font-weight: 600;
    }
    .admin-field textarea { min-height: 70px; resize: vertical; }
    .check-row { display: flex; gap: 8px; align-items: center; color: var(--ink); font-weight: 900; }
    .check-row input { width: 18px; height: 18px; }
    .gallery-list { display: grid; gap: 8px; padding: 12px; background: rgba(22, 23, 19, 0.04); border-radius: 8px; }
    .gallery-item { display: grid; grid-template-columns: 72px minmax(0, 1fr) auto auto; gap: 8px; align-items: center; }
    .gallery-item img { height: 54px; object-fit: cover; background: #ddd; border-radius: 6px; }
    .admin-help {
      padding: 16px; color: var(--muted); background: rgba(87, 194, 173, 0.12);
      border: 1px solid rgba(23, 134, 117, 0.18); border-radius: 8px; line-height: 1.7;
    }
    .json-area {
      width: 100%; min-height: 280px; padding: 14px; color: #fff; background: #151713;
      border: 0; border-radius: 8px; font-family: Consolas, monospace; font-size: 13px; line-height: 1.55;
    }
    @media (max-width: 760px) {
      .editor-card, .field-grid, .gallery-item { grid-template-columns: 1fr; }
      .editor-preview { width: 100%; }
    }
  </style>
</head>
<body class="admin-page">
  <main class="admin-shell">
    <section class="admin-login" data-admin-login>
      <img src="/begins-logo.png" alt="BEGIN.S DESIGN 로고">
      <p class="section-kicker">Admin</p>
      <h1>관리자 페이지</h1>
      <p>관리자 비밀번호를 입력해주세요.</p>
      <form class="admin-password-form" data-login-form>
        <label>
          <span>관리자 비밀번호</span>
          <input type="password" autocomplete="current-password" maxlength="256" required>
        </label>
        <button type="submit">들어가기</button>
        <small class="admin-error" hidden>관리자 비밀번호를 확인해주세요.</small>
      </form>
      <a class="admin-home-link" href="/">홈으로 돌아가기</a>
    </section>

    <section class="admin-panel" data-admin-panel hidden>
      <div class="admin-toolbar">
        <div>
          <p class="section-kicker">Content Editor</p>
          <h1>포토 / 프로젝트 수정</h1>
          <p>사진을 교체하거나 삭제한 뒤 홈페이지에 저장을 누르세요.</p>
        </div>
        <a class="admin-home-link" href="/">사이트 보기</a>
      </div>

      <div class="admin-tabs" role="tablist" aria-label="편집 대상">
        <button class="is-active" type="button" data-tab="photos">Photo</button>
        <button type="button" data-tab="projects">Project</button>
      </div>

      <div class="admin-actions">
        <button type="button" data-add>사진 추가</button>
        <input type="file" data-new-photo hidden>
        <button type="button" data-save>홈페이지에 저장</button>
        <span class="admin-status" role="status" data-status></span>
      </div>

      <p>순서 변경 손잡이를 끌어서 놓거나 위로·아래로 버튼을 누르세요.</p>
      <div class="admin-list" data-list></div>
    </section>
  </main>

  <script type="module">
    import { createPublisher } from "/photo-publisher.mjs";

    let publisher;
    const uploads = new Map();
    const state = { content: { photos: [], projects: [] }, tab: "photos" };
    const login = document.querySelector("[data-admin-login]");
    const panel = document.querySelector("[data-admin-panel]");
    const loginForm = document.querySelector("[data-login-form]");
    const error = document.querySelector(".admin-error");
    const list = document.querySelector("[data-list]");
    const status = document.querySelector("[data-status]");

    const normalizePath = (path) => {
      if (!path) return "";
      if (uploads.has(path)) return uploads.get(path).preview;
      if (/^(https?:|data:|\/\/)/.test(path)) return path;
      return path.startsWith("/") ? ".." + path : "../" + path.replace(/^\.\//, "");
    };

    const setStatus = (message) => { status.textContent = message; };

    const render = () => {
      document.querySelectorAll("[data-tab]").forEach((button) => {
        button.classList.toggle("is-active", button.dataset.tab === state.tab);
      });
      document.querySelector("[data-add]").textContent = state.tab === "photos" ? "사진 추가" : "프로젝트 추가";
      const items = state.content[state.tab];
      list.replaceChildren(...items.map(createEditorCard));
      if (!items.length) list.textContent = "등록된 사진이 없습니다.";
    };

    const maxUploadBytes = 4 * 1024 * 1024;
    const acceptedTypes = ["image/jpeg", "image/png", "image/webp"];
    const pickerTypes = "image/jpeg,image/png,image/webp,image/avif,image/heic,image/heif,.heic,.heif";

    async function preparePhoto(file) {
      if (acceptedTypes.includes(file.type) && file.size > 0 && file.size <= maxUploadBytes) {
        return file;
      }
      const bitmap = await createImageBitmap(file);
      try {
        const canvas = document.createElement("canvas");
        const scale = Math.min(1, 2200 / Math.max(bitmap.width, bitmap.height));
        canvas.width = Math.max(1, Math.round(bitmap.width * scale));
        canvas.height = Math.max(1, Math.round(bitmap.height * scale));
        const context = canvas.getContext("2d", { alpha: false });
        context.fillStyle = "#fff";
        context.fillRect(0, 0, canvas.width, canvas.height);
        context.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
        for (const quality of [0.88, 0.72, 0.55]) {
          const image = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", quality));
          if (image && image.size <= maxUploadBytes) return image;
        }
        throw new Error("Photo exceeds upload limit");
      } finally {
        bitmap.close();
      }
    }

    function photoPicker(label, onSelect) {
      const input = document.createElement("input");
      input.type = "file";
      input.accept = pickerTypes;
      input.setAttribute("aria-label", label);
      input.addEventListener("change", async () => {
        const file = input.files[0];
        if (!file) return;
        const save = document.querySelector("[data-save]");
        save.disabled = true;
        setStatus("사진을 준비하고 있습니다…");
        try {
          const prepared = await preparePhoto(file);
          const path = "/managed-photos/" + crypto.randomUUID();
          uploads.set(path, { file: prepared, preview: URL.createObjectURL(prepared) });
          onSelect(path, file);
          setStatus("사진을 선택했습니다. 홈페이지에 저장을 눌러 반영하세요.");
          render();
        } catch {
          setStatus("이 사진을 열 수 없습니다. JPG, PNG 또는 WebP로 변환한 뒤 다시 선택해주세요.");
          input.value = "";
        } finally {
          save.disabled = false;
        }
      });
      return input;
    }

    function replacement(item) {
      const label = document.createElement("label");
      label.className = "import-button";
      const text = item.image ? "사진 교체" : "사진 선택";
      label.append(text, photoPicker(text, (path) => { item.image = path; }));
      return label;
    }

    const updateItem = (index, key, value) => {
      state.content[state.tab][index][key] = value;
    };

    function moveItem(items, from, to) {
      if (to < 0 || to >= items.length || from === to) return;
      const [item] = items.splice(from, 1);
      items.splice(to, 0, item);
      render();
      setStatus("순서를 바꿨습니다. 홈페이지에 저장을 눌러 반영하세요.");
    }

    let dragging;
    function orderControls(row, items, index) {
      const handle = document.createElement("span");
      handle.className = "drag-handle";
      handle.textContent = "⠿ 순서 변경";
      handle.draggable = true;
      handle.addEventListener("dragstart", (event) => {
        dragging = { items, index };
        event.dataTransfer.setData("text/plain", "photo-order");
        event.dataTransfer.effectAllowed = "move";
      });
      handle.addEventListener("dragend", () => { dragging = undefined; });
      row.addEventListener("dragover", (event) => {
        if (dragging?.items !== items) return;
        event.preventDefault();
        event.stopPropagation();
        event.dataTransfer.dropEffect = "move";
        row.classList.add("drop-target");
      });
      row.addEventListener("dragleave", (event) => {
        if (!row.contains(event.relatedTarget)) row.classList.remove("drop-target");
      });
      row.addEventListener("drop", (event) => {
        if (dragging?.items !== items) return;
        event.preventDefault();
        event.stopPropagation();
        row.classList.remove("drop-target");
        moveItem(items, dragging.index, index);
        dragging = undefined;
      });
      const up = button("위로", () => moveItem(items, index, index - 1));
      const down = button("아래로", () => moveItem(items, index, index + 1));
      return [handle, up, down];
    }

    const button = (text, onClick) => {
      const element = document.createElement("button");
      element.type = "button";
      element.textContent = text;
      element.addEventListener("click", onClick);
      return element;
    };

    const createInput = (labelText, value, onChange, multiline = false) => {
      const label = document.createElement("label");
      label.className = "admin-field";
      label.append(labelText);
      const input = document.createElement(multiline ? "textarea" : "input");
      input.value = value || "";
      input.addEventListener("input", () => onChange(input.value));
      label.append(input);
      return label;
    };

    const createCheck = (labelText, checked, onChange) => {
      const label = document.createElement("label");
      label.className = "check-row";
      const input = document.createElement("input");
      input.type = "checkbox";
      input.checked = Boolean(checked);
      input.addEventListener("change", () => {
        onChange(input.checked);
        render();
      });
      label.append(input, labelText);
      return label;
    };

    const createEditorCard = (item, index) => {
      const card = document.createElement("article");
      card.className = "editor-card";
      const preview = document.createElement("div");
      preview.className = "editor-preview";
      const img = document.createElement("img");
      img.src = normalizePath(item.image);
      img.alt = item.alt || item.title || "";
      preview.append(img);

      const fields = document.createElement("div");
      fields.className = "editor-fields";
      const fieldGrid = document.createElement("div");
      fieldGrid.className = "field-grid";
      fieldGrid.append(
        createInput("제목", item.title, (value) => updateItem(index, "title", value)),
        createInput("이미지 주소", item.image, (value) => updateItem(index, "image", value)),
        createInput("대체 설명", item.alt, (value) => updateItem(index, "alt", value), true)
      );

      if (state.tab === "photos") {
        fieldGrid.append(createCheck("흑백 사진", item.blackAndWhite, (value) => updateItem(index, "blackAndWhite", value)));
      } else {
        fieldGrid.append(createCheck("대표 카드", item.featured, (value) => updateItem(index, "featured", value)));
      }

      const actions = document.createElement("div");
      actions.className = "admin-row-actions";
      actions.append(
        replacement(item),
        ...orderControls(card, state.content[state.tab], index),
        button("복제", () => {
          state.content[state.tab].splice(index + 1, 0, JSON.parse(JSON.stringify(item)));
          render();
        }),
        button("삭제", () => {
          if (!confirm("이 항목을 홈페이지에서 삭제할까요?")) return;
          state.content[state.tab].splice(index, 1);
          render();
        })
      );

      fields.append(fieldGrid);
      if (state.tab === "projects") fields.append(createGalleryEditor(item));
      fields.append(actions);
      card.append(preview, fields);
      return card;
    };

    const createGalleryEditor = (item) => {
      item.gallery = Array.isArray(item.gallery) ? item.gallery : [];
      const wrap = document.createElement("div");
      wrap.className = "gallery-list";
      const title = document.createElement("strong");
      title.textContent = "상세 이미지";
      wrap.append(title);
      item.gallery.forEach((galleryItem, galleryIndex) => {
        const row = document.createElement("div");
        row.className = "gallery-item";
        const thumb = document.createElement("img");
        thumb.src = normalizePath(galleryItem.image);
        thumb.alt = galleryItem.alt || "";
        const input = document.createElement("input");
        input.value = galleryItem.image || "";
        input.placeholder = "/project-assets/example.jpg 또는 https://...";
        input.addEventListener("input", () => {
          galleryItem.image = input.value;
          galleryItem.alt = galleryItem.alt || item.alt || item.title || "Project image";
        });
        const controls = document.createElement("div");
        controls.className = "admin-row-actions";
        controls.append(...orderControls(row, item.gallery, galleryIndex), button("삭제", () => {
          if (!confirm("이 사진을 홈페이지에서 삭제할까요?")) return;
          item.gallery.splice(galleryIndex, 1);
          render();
        }));
        row.append(thumb, input, replacement(galleryItem), controls);
        wrap.append(row);
      });
      const actions = document.createElement("div");
      actions.className = "gallery-actions";
      actions.append(button("상세 이미지 추가", () => {
        item.gallery.push({ image: "", alt: item.alt || item.title || "Project image" });
        render();
      }));
      wrap.append(actions);
      return wrap;
    };

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const input = loginForm.querySelector("input");
      const submit = loginForm.querySelector("button");
      submit.disabled = true;
      error.hidden = true;
      try {
        const connection = createPublisher(input.value);
        state.content = await connection.load();
        publisher = connection;
        login.hidden = true;
        panel.hidden = false;
        render();
      } catch (failure) {
        error.textContent = failure.message;
        error.hidden = false;
      } finally {
        input.value = "";
        submit.disabled = false;
      }
    });

    document.querySelectorAll("[data-tab]").forEach((tab) => {
      tab.addEventListener("click", () => {
        state.tab = tab.dataset.tab;
        render();
      });
    });

    const newPhoto = photoPicker("새 사진 선택", (path, file) => {
      const title = file.name.replace(/\.[^.]+$/, "") || "새 사진";
      state.content.photos.push({ title, image: path, alt: title, blackAndWhite: false });
      newPhoto.value = "";
    });
    newPhoto.hidden = true;
    document.querySelector("[data-new-photo]").replaceWith(newPhoto);

    document.querySelector("[data-add]").addEventListener("click", () => {
      if (state.tab === "photos") {
        newPhoto.click();
        return;
      }
      state.content.projects.push({ title: "새 프로젝트", image: "", alt: "", featured: false, gallery: [] });
      render();
    });

    document.querySelector("[data-save]").addEventListener("click", async () => {
      const images = [...state.content.photos, ...state.content.projects.flatMap(
        (project) => [project, ...(project.gallery || [])]
      )];
      if (images.some(({ image }) => !image?.trim())) {
        setStatus("사진이 비어 있는 항목을 채우거나 삭제해주세요.");
        return;
      }
      const usedPaths = new Set(images.map(({ image }) => image));
      const files = Array.from(uploads).filter(([path]) => usedPaths.has(path))
        .map(([path, upload]) => [path.slice(1), upload]);
      const controls = panel.querySelectorAll("button, input, textarea");
      panel.inert = true;
      controls.forEach((control) => { control.disabled = true; });
      setStatus("홈페이지에 저장하고 있습니다…");
      try {
        await publisher.publish(state.content, files);
        for (const { preview } of uploads.values()) URL.revokeObjectURL(preview);
        uploads.clear();
        setStatus("저장했습니다. 홈페이지에 반영됐습니다.");
        render();
      } catch (failure) {
        setStatus(failure.message);
      } finally {
        panel.inert = false;
        controls.forEach((control) => { control.disabled = false; });
      }
    });
  </script>
</body>
</html>
